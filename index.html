<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZunnScript - Script Hub Draft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }

        /* HEADER */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
        }
        
        .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #00e676;
            background: #1a1a20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #00e676;
            font-size: 15px;
        }
        .channel-name {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .menu-icon {
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        /* HERO SECTION */
        .hero-section {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }
        .hero-subtitle {
            font-size: 11px;
            font-weight: bold;
            color: #00e676;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .hero-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .hero-desc {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        /* SEARCH BAR */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            width: 100%;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            background: #1a1a20;
            border: 1px solid #333;
            border-radius: 20px;
            color: #fff;
            outline: none;
        }
        .search-btn {
            background: #00875a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .script-count {
            font-size: 13px;
            color: #00e676;
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="main-wrapper">

    <!-- HEADER: KANAL ZUNNSCRIP -->
    <div class="header">
        <a href="https://youtube.com/@zunnscrip" target="_blank" class="channel-info">
            <div class="channel-avatar">Z</div>
            <span class="channel-name">ZunnScript</span>
        </a>
        <div class="menu-icon">☰</div>
    </div>

    <!-- HERO SECTION -->
    <div class="hero-section">
        <div class="hero-subtitle">SKRIP ROBLOX CEPAT DAN OP</div>
        <div class="hero-title">SCRIPT HUB</div>
        <div class="hero-desc">Skrip Roblox gratis, diperbarui secara berkala. Temukan satu, klik Dapatkan Skrip, dan selesai.</div>
    </div>

    <!-- SEARCH BOX -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari skrip...">
        <button class="search-btn">Cari</button>
    </div>
    <div class="script-count" id="scriptCount">0 skrip tersedia</div>

    <!-- AREA UNTUK MENEMPATKAN KARTU (CARD) DI SINI -->

</div>

</body>
</html>
